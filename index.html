<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Zayla Monroe — Creative Designer &amp; Developer</title>
    <meta name="description" content="Zayla Monroe is an independent creative designer and developer based in the Netherlands, working across brand, interface and motion." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zayla Monroe — Creative Designer &amp; Developer" />
    <meta property="og:description" content="An independent creative designer and developer based in the Netherlands." />
    <meta property="og:image" content="/art/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/art/favicon.svg" type="image/svg+xml" />
    <!-- The stylesheet is render-blocking, so this is belt and braces: it keeps
         the very first frame black rather than the browser's default white,
         which is what the page settles on anyway. -->
    <style>
      html { background: #000; }
      html[data-theme="light"] { background: #f6f4f0; }
    </style>
    <!-- Runs before the first paint, because the alternative is a flash of the
         wrong ground on every visit: the stylesheet is render-blocking but the
         bundle that reads the preference is not, so without this the page is
         painted black and then corrected. Kept to one expression and wrapped,
         since a visitor with storage blocked must still get a page. -->
    <script>
      try {
        var t = localStorage.getItem("zayla:theme");
        if (t !== "dark" && t !== "light") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (t === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
