<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="46"/></filter></defs>
  <rect width="1200" height="630" fill="#000000"/>
  <circle cx="980" cy="140" r="240" fill="#fd321c" opacity="0.4" filter="url(#soft)"/>
  <text x="80" y="330" fill="#ffffff" font-family="Poppins,Inter,sans-serif" font-size="96" font-weight="600" letter-spacing="-4">Zayla Monroe</text>
  <text x="80" y="400" fill="#fd321c" font-family="Inter,sans-serif" font-size="30" font-weight="600" letter-spacing="4">CREATIVE DESIGNER &amp; DEVELOPER</text>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.5"/>
</svg>